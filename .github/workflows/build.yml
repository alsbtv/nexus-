name: Build Release APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'
        
    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9
        
    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/nexus_release.keystore -alias nexus_key -keyalg RSA -keysize 2048 -validity 10000 -storepass nexus123456 -keypass nexus123456 -dname "CN=Nexus AI, OU=Dev, O=Nexus, L=City, ST=State, C=US"
        
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleRelease
      
    - name: Upload APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-AI-APK
        path: app/build/outputs/apk/release/*.apk
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Nexus AI Release v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}